[project]
name = "viewingguardian-mcp"
version = "0.1.0"
description = "AI Guardian & Language Layer for Fire TV"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.0.0",
    "uvicorn>=0.30.0",
    "starlette>=0.37.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "boto3>=1.34.0",
    "python-jose[cryptography]>=3.3.0",
    "python-dotenv>=1.0.0",
    "aiosqlite>=0.20.0",
    "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["server"]